  thumbnail: "images/24 hr RFU vs Time (FS).png"
  title: >-
    Effects of Epigallocatechin-3-gallate on Β-amyloid (25-35) Aggregation: an Application to Sporadic Inclusion Body Myositis
  description: >-
    Sporadic inclusion body myositis is marked by beta-amyloid aggregates in muscle tissue.
    Epigallocatechin-3-gallate was purified from green tea leaves, confirmed by FTIR, and tested
    against beta-amyloid (25-35) aggregation using a Thioflavine T fluorescence assay.
    Aggregation proceeded more slowly in the presence of EGCG over both one-hour and 24-hour
    periods.
  keywords:
    - Epigallocatechin-3-gallate
    - β-Amyloid
    - Thioflavine T
    - Inclusion Body Myositis
    - Fluorescence Spectroscopy
