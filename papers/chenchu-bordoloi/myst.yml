  thumbnail: "images/fig2.png"
  title: >-
    Effects of Caffeine Concentration on Survivability, Locomotor Activity, and Memory in Drosophila melanogaster
  description: >-
    Wild-type Drosophila melanogaster were reared on sugar diets containing 0.01%, 0.025% or
    0.05% caffeine and assessed for survival, climbing performance and short-term memory in a
    Y-maze. Moderate caffeine left survival unaffected, while higher concentrations trended
    toward reduced locomotor function and memory, though the differences did not reach
    significance.
