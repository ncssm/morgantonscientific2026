project:
  id: morganton-2026-quach
  thumbnail: "images/Representative images of flies used for quantification of abdominal dye dissemination post-treatment.png"
  title: >-
    Evaluating the Attenuating Effects of LAB-Fermented Black Garlic (Allium
    sativum) in the Drosophila melanogaster Model of Inflammatory Bowel Disease
    by ROS Scavenging
  description: >-
    Black garlic was produced by heat-ageing raw garlic, and extracts prepared with and without
    lactic acid bacteria fermentation. Antioxidant capacity was measured by DPPH assay, and gut
    permeability assessed in Drosophila melanogaster given dextran sulfate sodium, using a Smurf
    assay. Both extracts reduced dye leakage dose-dependently, with fermentation showing no
    antioxidant advantage.
  keywords:
    - Black Garlic
    - Inflammatory Bowel Disease
    - Intestinal Permeability
    - Reactive Oxygen Species
    - Lactic Acid Bacteria
  authors:
