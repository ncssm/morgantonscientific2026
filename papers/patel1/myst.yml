project:
  id: morganton-2026-patel1
  thumbnail: "../../templates/ncssm-preface/logo.png"
  title: Generalization Failures in AI-Based Leukemia Detection
  description: >-
    AI models for detecting leukemia from blood smears routinely report accuracies above 97%,
    but those figures come almost entirely from single-institution testing. This review examines
    how differences in staining protocol, slide preparation, scanners and imaging software
    degrade performance across institutions, surveys the benchmark datasets in common use, and
    argues that stain normalization remains underused.
  subject: Biology
  keywords:
    - Leukemia Detection
    - Stain Variability
    - Blood Smear Classification
    - Cross-Institution Validation
    - Convolutional Neural Networks
  authors: 
    - name: Ayush Patel
      affiliation: ncssm
      email: patel27a3@ncssm.edu
      orcid: 0009-0007-3614-5657
  abbreviations:
    ALL: Acute Lymphoblastic Leukemia
    AML: Acute Myeloid Leukemia
    WBC: White Blood Cell
    CNN: Convolutional Neural Network
    ViT: Vision Transformer
