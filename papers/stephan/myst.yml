project:
  id: morganton-2026-stephan
  thumbnail: "images/figure5.png"
  title: "Exercise-based Interventions in Parkinson's Disease: A Pilot Study"
  description: >-
    Twelve participants completed a three-session obstacle-course intervention aimed at
    improving gait in Parkinson's disease, with gait initiation and steady-state gait measured
    before and after. Errors and reaction time fell significantly, and the first step of gait
    initiation lengthened, though other gait parameters were unchanged. The authors present it
    as a feasible pilot warranting longer study.
  keywords:
    - Parkinson's Disease
    - Exercise Intervention
    - Motor Imagery
    - Gait
    - Balance Training
  subject: Biology

  authors:
    - name: Carter Stephan
      affiliation: ncssm
      email: stephan26c@ncssm.edu
      orcid: 0009-0008-0853-4687
      corresponding: true
  abbreviations:
    PD: Parkinson's Disease
    FoG: Freezing of Gait
    M1: Motor Cortex
    MI: Motor Imagery
    AO: Action Observation
    DBS: Deep Brain Stimulation
    ADL: Activities of Daily Living
    CWT: Complex Walking Task
    VR: Virtual Reality
    PA: Physical Activity
  # TODO(2026): CRediT roles could not be collected from these authors before
